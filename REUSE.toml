version = 1
SPDX-PackageName = "sinter-packs"
SPDX-PackageSupplier = "The Sinter Authors"

[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "The Sinter Authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["packs/javascript/grammars/javascript.wasm", "packs/javascript/licenses/tree-sitter-javascript.LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2014 Max Brunsfeld"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["packs/typescript/grammars/typescript.wasm", "packs/typescript/grammars/tsx.wasm", "packs/typescript/licenses/tree-sitter-typescript.LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2017 Max Brunsfeld"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["packs/rust/grammars/rust.wasm", "packs/rust/licenses/tree-sitter-rust.LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2017 Maxim Sokolov"
SPDX-License-Identifier = "MIT"
